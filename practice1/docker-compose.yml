version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./input_files:/app/input_files
      - ./output_files:/app/output_files
    depends_on:
      - ffmpeg

  ffmpeg:
    image: jrottenberg/ffmpeg:latest
    volumes:
      - ./input_files:/input
      - ./output_files:/output
    command: ["tail", "-f", "/dev/null"]